name: Tests

on:
  push:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Get project
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check Node version
        run: node --version

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test -- --run